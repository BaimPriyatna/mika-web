<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="pragma" content="no-cache">
  <meta http-equiv="expires" content="-1">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WiFi Sekolah</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card-wrapper">
  <div class="card">
    <div class="card-header">
      <div class="school-logo">
        <svg viewBox="0 0 24 24">
          <path d="M5 13.18v4L12 21l7-3.82v-4L12 17l-7-3.82zM12 3L1 9l11 6 9-4.91V17h2V9L12 3z"/>
        </svg>
      </div>
      <h1 class="school-name">TERJADI KENDALA KONEKSI</h1>
      <p class="school-sub">Sistem tidak dapat memproses permintaan Anda</p>
    </div>

    <div class="alert alert-danger">
      <strong>Pesan Sistem:</strong><br>
      $(error)
    </div>

    <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.5;">
      Pastikan kode voucher Anda telah dimasukkan dengan benar. Jika kendala berlanjut, silakan hubungi Administrator.
    </p>

    <a href="$(link-login)" class="btn btn-primary">
      Kembali ke Halaman Login
    </a>

    <div class="card-footer">
      <div>WiFi Sekolah</div>
    </div>
  </div>

  <div class="page-footer">
    RouterOS Hotspot Service
  </div>
</div>

</body>
</html>

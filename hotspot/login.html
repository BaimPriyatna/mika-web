<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="pragma" content="no-cache">
  <meta http-equiv="expires" content="-1">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WIFI TKJ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

$(if chap-id)
<form name="sendin" action="$(link-login-only)" method="post">
  <input type="hidden" name="username" />
  <input type="hidden" name="password" />
  <input type="hidden" name="dst" value="$(link-orig)" />
  <input type="hidden" name="popup" value="true" />
</form>

<script type="text/javascript" src="/md5.js"></script>
$(endif)
<script type="text/javascript">
<!--
    // Satu kode akun: password selalu sama dengan username.
    function doLogin() {
      var code = document.login.username.value;
$(if chap-id)
      document.sendin.username.value = code;
      document.sendin.password.value = hexMD5('$(chap-id)' + code + '$(chap-challenge)');
      document.sendin.submit();
      return false;
$(else)
      document.login.password.value = code;
      return true;
$(endif)
    }
//-->
</script>

<div class="card-wrapper">
  <div class="card">
    <div class="card-header">
      <div class="school-logo">
        <svg viewBox="0 0 24 24">
          <path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/>
        </svg>
      </div>
      <h1 class="school-name">WIFI TKJ</h1>
      <p class="school-sub">Masukkan kode akun Anda</p>
    </div>

    $(if error)
    <div class="alert alert-danger">
      $(error)
    </div>
    $(endif)

    <form name="login" action="$(link-login-only)" method="post" onSubmit="return doLogin()">
      <input type="hidden" name="dst" value="$(link-orig)" />
      <input type="hidden" name="popup" value="true" />

      <input type="hidden" name="password" value="" />

      <div class="form-group">
        <label class="form-label" for="username">Kode Akun</label>
        <input class="form-input" name="username" id="username" type="text" value="$(username)" placeholder="Masukkan kode akun" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" />
      </div>

      <input class="btn btn-primary" type="submit" value="Masuk" />
    </form>

    $(if trial == 'yes')
    <div style="margin-top: 14px; text-align: center; font-size: 13px; color: var(--text-muted);">
      Tersedia akses uji coba, <a href="$(link-login-only)?dst=$(link-orig-esc)&amp;username=T-$(mac-esc)" style="color: var(--primary); font-weight: 600; text-decoration: none;">klik di sini</a>.
    </div>
    $(endif)

    <div id="beli-wrap" style="display: none; margin-top: 16px; text-align: center;">
      <div style="font-size: 13px; color: var(--text-muted); margin-bottom: 8px;">Belum punya akun?</div>
      <a id="beli-link" class="btn btn-secondary" href="#" style="display: block; text-decoration: none;">Beli Akun</a>
    </div>

    <div class="card-footer">
      <div>WIFI TKJ</div>
    </div>
  </div>

  <div class="page-footer">
    IP: $(ip) | MAC: $(mac)
  </div>
</div>

<script type="text/javascript">
<!--
  document.login.username.focus();

  // Halaman beli akun yang disajikan router dari folder ini (beli.html). Alamat backend diatur di beli-config.js.
  // Kosongkan untuk menyembunyikan tombol Beli Akun.
  var SHOP_URL = 'beli.html';
  if (SHOP_URL) {
    document.getElementById('beli-link').href = SHOP_URL;
    document.getElementById('beli-wrap').style.display = 'block';
  }
//-->
</script>

</body>
</html>
